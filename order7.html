<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r.mint - モバイルオーダー</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module">
        // Firebase設定をグローバルスコープで利用可能にする
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClG9FZfjx4iA3_VwiSXwksjGIo-6kLRMg",
            authDomain: "rmint-order.firebaseapp.com",
            databaseURL: "https://rmint-order-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rmint-order",
            storageBucket: "rmint-order.firebasestorage.app",
            messagingSenderId: "115039847213",
            appId: "1:115039847213:web:16c3f6959ce094682e49a4"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseDB = getDatabase(app);
        window.firebaseRef = ref;
        window.firebasePush = push;
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --mint-primary: #4a9b8e;
            --mint-light: #e8f5f3;
            --mint-dark: #2d5f56;
            --cream: #faf8f5;
            --charcoal: #3a3a3a;
            --warm-white: #fffcf7;
            --terracotta: #d4756c;
            --shadow-soft: 0 8px 24px rgba(74, 155, 142, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--mint-light) 100%);
            color: var(--charcoal);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .header {
            background: var(--warm-white);
            padding: 24px 20px;
            border-bottom: 1px solid rgba(74, 155, 142, 0.1);
            box-shadow: var(--shadow-soft);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-center {
            flex: 1;
            text-align: center;
        }

        .cart-icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--mint-light);
            border: none;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s ease;
        }

        .cart-icon-btn:active {
            transform: scale(0.95);
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--terracotta);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            display: none;
        }

        .cart-badge.show {
            display: flex;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            font-weight: 300;
            color: var(--mint-dark);
            letter-spacing: 4px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--mint-primary);
            text-transform: uppercase;
            font-weight: 400;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: var(--warm-white);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.1);
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(2px);
        }

        .cart-overlay.show {
            display: block;
        }

        .cart-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(74, 155, 142, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 400;
            color: var(--mint-dark);
        }

        .cart-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--mint-light);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .cart-close:active {
            transform: scale(0.95);
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            background: var(--cream);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--charcoal);
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-size: 14px;
            color: var(--mint-primary);
            font-weight: 500;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--mint-primary);
            background: var(--warm-white);
            color: var(--mint-primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .cart-qty-btn:active {
            transform: scale(0.9);
            background: var(--mint-primary);
            color: white;
        }

        .cart-qty {
            font-size: 16px;
            font-weight: 500;
            min-width: 24px;
            text-align: center;
        }

        .cart-footer-drawer {
            padding: 20px;
            border-top: 1px solid rgba(74, 155, 142, 0.1);
            background: var(--warm-white);
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 15px;
        }

        .cart-summary-label {
            color: #7a7a7a;
        }

        .cart-summary-value {
            font-weight: 500;
            color: var(--charcoal);
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 2px solid var(--mint-primary);
            margin-bottom: 16px;
        }

        .cart-total-label {
            font-size: 16px;
            font-weight: 500;
            color: var(--charcoal);
        }

        .cart-total-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--mint-dark);
        }

        .cart-checkout-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--mint-primary), var(--mint-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 16px rgba(74, 155, 142, 0.3);
        }

        .cart-checkout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cart-checkout-btn:not(:disabled):active {
            transform: translateY(2px);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .menu-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 400;
            color: var(--mint-dark);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--mint-primary);
            letter-spacing: 1px;
        }

        .menu-item {
            background: var(--warm-white);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--mint-primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .menu-item:active {
            transform: scale(0.98);
        }

        .menu-item:hover::before {
            transform: scaleY(1);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .item-name {
            font-size: 18px;
            font-weight: 500;
            color: var(--charcoal);
        }

        .item-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--mint-primary);
        }

        .item-description {
            font-size: 13px;
            color: #7a7a7a;
            line-height: 1.6;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        .qty-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--mint-primary);
            background: var(--warm-white);
            color: var(--mint-primary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }

        .qty-btn:active {
            transform: scale(0.9);
            background: var(--mint-primary);
            color: white;
        }

        .qty-display {
            font-size: 18px;
            font-weight: 500;
            min-width: 30px;
            text-align: center;
            color: var(--mint-dark);
        }

        .call-staff-btn {
            position: fixed;
            bottom: 180px;
            right: 20px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--terracotta);
            color: white;
            border: none;
            font-size: 24px;
            box-shadow: 0 4px 16px rgba(212, 117, 108, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 16px rgba(212, 117, 108, 0.3);
            }
            50% {
                box-shadow: 0 4px 24px rgba(212, 117, 108, 0.5);
            }
        }

        .call-staff-btn:active {
            transform: scale(0.95);
        }

        .cart-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--warm-white);
            padding: 20px;
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
            border-top: 1px solid rgba(74, 155, 142, 0.1);
        }

        .cart-summary {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .cart-total {
            font-size: 14px;
            color: #7a7a7a;
        }

        .cart-amount {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--mint-dark);
        }

        .order-btn {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 18px;
            background: linear-gradient(135deg, var(--mint-primary), var(--mint-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 16px rgba(74, 155, 142, 0.3);
        }

        .order-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .order-btn:not(:disabled):active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(74, 155, 142, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--warm-white);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            color: var(--mint-dark);
            margin-bottom: 12px;
        }

        .modal-text {
            font-size: 14px;
            color: #7a7a7a;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .modal-btn {
            width: 100%;
            padding: 16px;
            background: var(--mint-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn:active {
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9a9a9a;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-text {
            font-size: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--mint-light);
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--mint-primary);
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--charcoal);
            margin-bottom: 2px;
        }

        .user-status {
            font-size: 12px;
            color: var(--mint-primary);
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--warm-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .loading-screen.hide {
            display: none;
        }

        .loading-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 48px;
            font-weight: 300;
            color: var(--mint-dark);
            letter-spacing: 6px;
            margin-bottom: 24px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--mint-light);
            border-top-color: var(--mint-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 注文履歴 */
        .history-btn {
            padding: 8px 16px;
            background: var(--mint-light);
            color: var(--mint-dark);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .history-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .history-modal.show {
            display: flex;
        }

        .history-content {
            background: var(--warm-white);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .history-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--mint-dark);
        }

        .history-close {
            background: none;
            border: none;
            font-size: 32px;
            color: #999;
            cursor: pointer;
            line-height: 1;
        }

        .history-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid var(--mint-primary);
        }

        .history-date {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .history-items {
            margin: 8px 0;
        }

        .history-item-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
        }

        .history-total {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 16px;
            color: var(--mint-dark);
        }

        .history-empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- ローディング画面 -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-logo">r.mint</div>
        <div class="loading-spinner"></div>
    </div>

    <div class="header">
        <div style="width: 48px;"></div>
        <div class="header-center">
            <div class="logo">r.mint</div>
            <div class="subtitle">Café & Lounge</div>
        </div>
        <button class="cart-icon-btn" onclick="openCart()">
            🛒
            <span class="cart-badge" id="cart-badge">0</span>
        </button>
    </div>

    <div class="container">
        <!-- ユーザー情報 -->
        <div class="user-info" id="user-info" style="display: none;">
            <img class="user-avatar" id="user-avatar" src="" alt="User">
            <div class="user-details">
                <div class="user-name" id="user-name">ゲスト</div>
                <div class="user-status" id="user-status">LINE ログイン済み</div>
            </div>
            <button class="history-btn" onclick="showHistory()">注文履歴</button>
        </div>

        <div class="menu-section">
            <h2 class="section-title">Menu</h2>
            
            <div class="menu-item" data-item="drink">
                <div class="item-header">
                    <span class="item-name">ドリンク</span>
                    <span class="item-price">¥500</span>
                </div>
                <p class="item-description">厳選された季節のドリンクをお楽しみください</p>
                <div class="quantity-control">
                    <button class="qty-btn" onclick="updateQuantity('drink', -1)">−</button>
                    <span class="qty-display" id="drink-qty">0</span>
                    <button class="qty-btn" onclick="updateQuantity('drink', 1)">+</button>
                </div>
            </div>

            <div class="menu-item" data-item="sweets">
                <div class="item-header">
                    <span class="item-name">スイーツ</span>
                    <span class="item-price">¥1,000</span>
                </div>
                <p class="item-description">シェフ特製の本日のスイーツ</p>
                <div class="quantity-control">
                    <button class="qty-btn" onclick="updateQuantity('sweets', -1)">−</button>
                    <span class="qty-display" id="sweets-qty">0</span>
                    <button class="qty-btn" onclick="updateQuantity('sweets', 1)">+</button>
                </div>
            </div>

            <div class="menu-item" data-item="soup">
                <div class="item-header">
                    <span class="item-name">スープ</span>
                    <span class="item-price">¥500</span>
                </div>
                <p class="item-description">心温まる手作りスープ</p>
                <div class="quantity-control">
                    <button class="qty-btn" onclick="updateQuantity('soup', -1)">−</button>
                    <span class="qty-display" id="soup-qty">0</span>
                    <button class="qty-btn" onclick="updateQuantity('soup', 1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <button class="call-staff-btn" onclick="callStaff()">🔔</button>

    <!-- カートオーバーレイ -->
    <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>

    <!-- カートドロワー -->
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2 class="cart-title">カート</h2>
            <button class="cart-close" onclick="closeCart()">×</button>
        </div>
        <div class="cart-body" id="cart-items">
            <div class="empty-state">
                <div class="empty-icon">🛒</div>
                <p class="empty-text">カートは空です</p>
            </div>
        </div>
        <div class="cart-footer-drawer">
            <div class="cart-summary-row">
                <span class="cart-summary-label">小計</span>
                <span class="cart-summary-value">¥<span id="cart-subtotal">0</span></span>
            </div>
            <div class="cart-total-row">
                <span class="cart-total-label">合計</span>
                <span class="cart-total-value">¥<span id="cart-total">0</span></span>
            </div>
            <button class="cart-checkout-btn" id="cart-checkout-btn" onclick="placeOrder()" disabled>
                注文する
            </button>
        </div>
    </div>

    <div class="cart-footer">
        <div class="cart-summary">
            <span class="cart-total">合計</span>
            <span class="cart-amount">¥<span id="total-amount">0</span></span>
        </div>
        <button class="order-btn" id="order-btn" onclick="placeOrder()" disabled>注文する</button>
    </div>

    <!-- 注文完了モーダル -->
    <div class="modal" id="order-modal">
        <div class="modal-content">
            <div class="modal-icon">✓</div>
            <h3 class="modal-title">ご注文ありがとうございます</h3>
            <p class="modal-text">ご注文を承りました。<br>しばらくお待ちください。</p>
            <button class="modal-btn" onclick="closeModal('order-modal')">閉じる</button>
        </div>
    </div>

    <!-- スタッフ呼び出しモーダル -->
    <div class="modal" id="call-modal">
        <div class="modal-content">
            <div class="modal-icon">🔔</div>
            <h3 class="modal-title">スタッフを呼び出しました</h3>
            <p class="modal-text">スタッフがすぐに伺います。<br>少々お待ちください。</p>
            <button class="modal-btn" onclick="closeModal('call-modal')">閉じる</button>
        </div>
    </div>

    <!-- 注文履歴モーダル -->
    <div class="history-modal" id="history-modal">
        <div class="history-content">
            <div class="history-header">
                <h3 class="history-title">注文履歴</h3>
                <button class="history-close" onclick="closeHistory()">×</button>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        // LIFF設定
        const LIFF_ID = '2009786507-YbKVPQ6U'; // ミニアプリ用
        let userProfile = null;
        let tableNumber = '不明'; // テーブル番号

        // URLパラメータからテーブル番号を取得
        function getTableNumber() {
            const params = new URLSearchParams(window.location.search);
            return params.get('table') || '不明';
        }

        // LIFF初期化
        window.addEventListener('DOMContentLoaded', async () => {
            // テーブル番号を取得
            tableNumber = getTableNumber();
            
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    // 未ログインの場合はログイン画面へ
                    liff.login();
                } else {
                    // ログイン済みの場合はユーザー情報取得
                    await loadUserProfile();
                    hideLoading();
                }
            } catch (error) {
                console.error('LIFF初期化エラー:', error);
                alert('LINEとの接続に失敗しました。もう一度お試しください。');
                hideLoading();
            }
        });

        async function loadUserProfile() {
            try {
                userProfile = await liff.getProfile();
                
                // ユーザー情報を画面に表示
                document.getElementById('user-avatar').src = userProfile.pictureUrl || 'https://via.placeholder.com/48';
                document.getElementById('user-name').textContent = userProfile.displayName || 'ゲスト';
                
                // テーブル番号を表示
                if (tableNumber !== '不明') {
                    document.getElementById('user-status').textContent = `テーブル ${tableNumber} | LINE ログイン済み`;
                }
                
                document.getElementById('user-info').style.display = 'flex';
                
                console.log('ユーザー情報:', {
                    userId: userProfile.userId,
                    displayName: userProfile.displayName,
                    pictureUrl: userProfile.pictureUrl,
                    tableNumber: tableNumber
                });
            } catch (error) {
                console.error('プロフィール取得エラー:', error);
            }
        }

        function hideLoading() {
            document.getElementById('loading-screen').classList.add('hide');
        }

        const prices = {
            drink: 500,
            sweets: 1000,
            soup: 500
        };

        const itemNames = {
            drink: 'ドリンク',
            sweets: 'スイーツ',
            soup: 'スープ'
        };

        let cart = {
            drink: 0,
            sweets: 0,
            soup: 0
        };

        function updateQuantity(item, change) {
            cart[item] = Math.max(0, cart[item] + change);
            document.getElementById(item + '-qty').textContent = cart[item];
            updateTotal();
            updateCartBadge();
            updateCartDrawer();
        }

        function updateTotal() {
            const total = Object.keys(cart).reduce((sum, item) => {
                return sum + (cart[item] * prices[item]);
            }, 0);
            
            document.getElementById('total-amount').textContent = total.toLocaleString();
            
            const orderBtn = document.getElementById('order-btn');
            const hasItems = Object.values(cart).some(qty => qty > 0);
            orderBtn.disabled = !hasItems;
        }

        function updateCartBadge() {
            const totalItems = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
            const badge = document.getElementById('cart-badge');
            
            if (totalItems > 0) {
                badge.textContent = totalItems;
                badge.classList.add('show');
            } else {
                badge.classList.remove('show');
            }
        }

        function updateCartDrawer() {
            const cartItemsContainer = document.getElementById('cart-items');
            const hasItems = Object.values(cart).some(qty => qty > 0);
            
            if (!hasItems) {
                cartItemsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🛒</div>
                        <p class="empty-text">カートは空です</p>
                    </div>
                `;
                document.getElementById('cart-checkout-btn').disabled = true;
                document.getElementById('cart-subtotal').textContent = '0';
                document.getElementById('cart-total').textContent = '0';
                return;
            }

            let html = '';
            let subtotal = 0;

            Object.keys(cart).forEach(item => {
                if (cart[item] > 0) {
                    const itemTotal = cart[item] * prices[item];
                    subtotal += itemTotal;
                    html += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${itemNames[item]}</div>
                                <div class="cart-item-price">¥${prices[item].toLocaleString()} × ${cart[item]}</div>
                            </div>
                            <div class="cart-item-controls">
                                <button class="cart-qty-btn" onclick="updateQuantity('${item}', -1)">−</button>
                                <span class="cart-qty">${cart[item]}</span>
                                <button class="cart-qty-btn" onclick="updateQuantity('${item}', 1)">+</button>
                            </div>
                        </div>
                    `;
                }
            });

            cartItemsContainer.innerHTML = html;
            document.getElementById('cart-subtotal').textContent = subtotal.toLocaleString();
            document.getElementById('cart-total').textContent = subtotal.toLocaleString();
            document.getElementById('cart-checkout-btn').disabled = false;
        }

        function openCart() {
            document.getElementById('cart-drawer').classList.add('open');
            document.getElementById('cart-overlay').classList.add('show');
            updateCartDrawer();
        }

        function closeCart() {
            document.getElementById('cart-drawer').classList.remove('open');
            document.getElementById('cart-overlay').classList.remove('show');
        }

        function placeOrder() {
            // 注文データを準備
            const orderData = {
                tableNumber: tableNumber,  // テーブル番号を追加
                userId: userProfile?.userId,
                userName: userProfile?.displayName,
                items: Object.keys(cart).filter(item => cart[item] > 0).map(item => ({
                    name: itemNames[item],
                    quantity: cart[item],
                    price: prices[item]
                })),
                total: Object.keys(cart).reduce((sum, item) => sum + (cart[item] * prices[item]), 0),
                timestamp: new Date().toISOString()
            };

            // Firebaseに注文を保存
            const ordersRef = window.firebaseRef(window.firebaseDB, 'orders');
            window.firebasePush(ordersRef, orderData)
                .then(() => {
                    console.log('注文がFirebaseに保存されました:', orderData);
                })
                .catch((error) => {
                    console.error('Firebase保存エラー:', error);
                    alert('注文の送信に失敗しました。もう一度お試しください。');
                });
            
            // カートを閉じる
            closeCart();
            
            // モーダル表示
            document.getElementById('order-modal').classList.add('show');
            
            // カートをリセット
            setTimeout(() => {
                cart = { drink: 0, sweets: 0, soup: 0 };
                document.getElementById('drink-qty').textContent = '0';
                document.getElementById('sweets-qty').textContent = '0';
                document.getElementById('soup-qty').textContent = '0';
                updateTotal();
                updateCartBadge();
            }, 1500);
        }

        function callStaff() {
            // スタッフ呼び出しデータを準備
            const callData = {
                tableNumber: tableNumber,  // テーブル番号を追加
                userId: userProfile?.userId,
                userName: userProfile?.displayName,
                timestamp: new Date().toISOString()
            };

            // Firebaseに呼び出しを保存
            const callsRef = window.firebaseRef(window.firebaseDB, 'calls');
            window.firebasePush(callsRef, callData)
                .then(() => {
                    console.log('スタッフ呼び出しがFirebaseに保存されました:', callData);
                })
                .catch((error) => {
                    console.error('Firebase保存エラー:', error);
                });
            
            document.getElementById('call-modal').classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        // 注文履歴を表示
        async function showHistory() {
            if (!userProfile) return;
            
            const { onValue, query, orderByChild, equalTo } = await import("https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js");
            
            // 自分の注文だけを取得
            const ordersRef = window.firebaseRef(window.firebaseDB, 'orders');
            const myOrdersQuery = query(ordersRef, orderByChild('userId'), equalTo(userProfile.userId));
            
            onValue(myOrdersQuery, (snapshot) => {
                const orders = snapshot.val();
                displayHistoryList(orders);
            }, { onlyOnce: true });
            
            document.getElementById('history-modal').classList.add('show');
        }

        function displayHistoryList(orders) {
            const listContainer = document.getElementById('history-list');
            
            if (!orders || Object.keys(orders).length === 0) {
                listContainer.innerHTML = '<div class="history-empty">注文履歴がありません</div>';
                return;
            }

            // 日付順でソート（新しい順）
            const sortedOrders = Object.entries(orders).sort((a, b) => {
                return new Date(b[1].timestamp) - new Date(a[1].timestamp);
            });

            let html = '';
            sortedOrders.forEach(([orderId, order]) => {
                const date = new Date(order.timestamp);
                const dateStr = date.toLocaleDateString('ja-JP', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="history-item-row">
                            <span>${item.name} ×${item.quantity}</span>
                            <span>¥${item.price * item.quantity}</span>
                        </div>
                    `;
                });

                html += `
                    <div class="history-item">
                        <div class="history-date">${dateStr} | テーブル ${order.tableNumber || '不明'}</div>
                        <div class="history-items">${itemsHtml}</div>
                        <div class="history-total">
                            <span>合計</span>
                            <span>¥${order.total}</span>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        function closeHistory() {
            document.getElementById('history-modal').classList.remove('show');
        }

        // モーダル背景クリックで閉じる
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
